server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    # ---- equivalente ao "cleanUrls" da Vercel ----
    # /sites abre sites.html. Sem isso todos os links internos do site
    # quebrariam, porque foram escritos sem a extensao.
    location / {
        try_files $uri $uri.html $uri/ @agenda;
    }

    # ---- links de agendamento das barbearias ----
    # A Vercel repassava /nome-abc123 pro Barber Book. Agora o Barber Book tem
    # dominio proprio, entao o link redireciona pra la levando o slug na query
    # (o app aceita ?slug= alem do caminho).
    # Fica DEPOIS do try_files: uma pagina real do site sempre ganha do slug.
    location @agenda {
        if ($uri ~ "^/([a-z0-9-]+-[a-f0-9]{6})$") {
            return 301 https://agenda.smartlinkdigital.com.br/agendar.html?slug=$1;
        }
        return 404;
    }

    # ---- rotas antigas do Barber Book ----
    location = /smart-agenda          { return 301 https://agenda.smartlinkdigital.com.br/; }
    location = /smart-agenda/login    { return 301 https://agenda.smartlinkdigital.com.br/login.html; }
    location = /smart-agenda/agendar  { return 301 https://agenda.smartlinkdigital.com.br/agendar.html; }
    location = /smart-agenda/config.js{ return 301 https://agenda.smartlinkdigital.com.br/config.js; }
    location = /smart-agenda/logo.png { return 301 https://agenda.smartlinkdigital.com.br/logo.png; }
    location = /config.js             { return 301 https://agenda.smartlinkdigital.com.br/config.js; }
    location = /logo.png              { return 301 https://agenda.smartlinkdigital.com.br/logo.png; }
    location /icones/                 { return 301 https://agenda.smartlinkdigital.com.br$request_uri; }

    # As rotas /api/mp-* da Vercel foram removidas de proposito: o Mercado
    # Pago saiu do Barber Book. Responder 410 (removido em definitivo) em vez
    # de 404 deixa claro que a rota existiu e nao vai voltar.
    location = /api/mp-criar-cobranca { return 410; }
    location = /api/mp-webhook        { return 410; }
    location = /api/mp-callback       { return 410; }

    # ---- cache ----
    # HTML sempre revalidado: era o comportamento no vercel.json, e evita que
    # alguem fique vendo uma versao antiga do site depois de um deploy.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    # imagens e css mudam junto com o deploy, mas raramente — cache curto
    location ~* \.(png|jpg|jpeg|svg|webp|ico|css)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # ---- trava de seguranca ----
    # O vazamento da chave do Google aconteceu porque a pasta inteira foi
    # publicada. O deploy agora copia arquivo por arquivo, e isto aqui e a
    # segunda barreira: mesmo que algo escape, nao e servido.
    location ~* \.(json|env|key|pem|sql|log|md)$ { return 404; }
    location ~ /\.                               { return 404; }

    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml;
    gzip_min_length 1024;
}
